# Companies whose public ATS board the agent fetches every run.
# ats: greenhouse | lever | ashby | comeet. board: the company's name in that ATS's URL;
# for comeet it's "<slug>/<uid>" from the career page URL (comeet.com/jobs/<slug>/<uid>).
# Find new ones with: python -m jobagent discover "Company Name" ... (or a comeet.com/jobs/... URL)
